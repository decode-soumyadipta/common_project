name: offline-3d-gis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Heavy geo/native libs in conda for cross-platform reliability (Windows/macOS/Linux)
  - gdal>=3.8.0  # GDAL with GPU support for NVIDIA on Windows
  - rasterio=1.4.3
  - pyproj
  - shapely=2.0.7
  - scipy
  - numpy
  - pip:
      # Pull app + desktop + dev dependencies from pyproject.toml
      - -e .[desktop,geo,dev]
