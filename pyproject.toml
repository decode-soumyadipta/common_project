[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-3d-gis-app"
version = "0.1.0"
description = "Offline-first modular 3D GIS desktop and API stack"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "numpy>=1.26,<3.0",
  "titiler.application>=0.26,<1.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.10",   # Required by FastAPI for UploadFile / multipart form parsing
  "python-dotenv>=1.0",         # .env config loading used throughout
]

[project.scripts]
# Legacy entry points (src/)
offline-gis-cli = "offline_gis_app.cli:main"
offline-gis-server = "server_vm.main_server:main"
offline-gis-client = "desktop_client.main_client:main"
offline-gis-admin = "desktop_ingestion.main_admin:main"

# New modular entry points (src_new/)
offline-gis-ingestion-service = "src_new.services.ingestion.service:main"
offline-gis-tile-service = "src_new.services.tile_serving.service:main"
offline-gis-query-service = "src_new.services.query.service:main"
offline-gis-ingestion-client = "src_new.clients.desktop_ingestion.main:main"
offline-gis-search-client = "src_new.clients.desktop_search.main:main"

[project.optional-dependencies]
desktop = [
  "qtpy>=2.4,<3.0",
  "PyQt5>=5.15,<6.0",
  "PyQtWebEngine>=5.15,<6.0",
  "qtawesome>=1.3,<2.0",
  "pyqtgraph>=0.13.0",
  "pyopengl>=3.1.0",
  "laspy>=2.4.0",
]
geo = [
  "gdal>=3.10.3",
  "rasterio>=1.4.3,<2.0",
  "pyproj>=3.6,<4.0",
  "shapely>=2.0,<3.0",
  "scipy>=1.11,<2.0",
  "pysolar>=0.13,<1.0",
  "opencv-python>=4.13,<5.0",  # Video export and image processing
  "pillow>=12.0,<13.0",        # Image I/O support for video frames
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0",
  "vulture>=2.11,<3.0",
  "pyright>=1.1.350,<2.0",
  "coverage[toml]>=7.4,<8.0",
  "deptry>=0.12,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "RUF"]
ignore = [
    "E501", "SIM108", "RUF001", "RUF002", "RUF003", "B008", "N806", 
    "ARG001", "ARG002", "ARG005", "N802", "N803", "SIM102", "RUF012", 
    "N811", "N814", "B007", "N815"
]

[tool.ruff.lint.per-file-ignores]
"src_new/tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "RUF059", "S101", "N806"]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005", "RUF059", "S101", "N806"]

[tool.vulture]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*vendor*"]
ignore_decorators = ["@*handler", "@*connect", "@*slot"]
ignore_names = ["*_btn", "layout_*", "*_widget", "*_layout"]
min_confidence = 80
paths = ["src_new"]

[tool.pyright]
include = ["src_new"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/vendor"
]
venvPath = "/opt/homebrew/Caskroom/miniconda/base/envs"
venv = "offline-3d-gis"
pythonPath = "/opt/homebrew/Caskroom/miniconda/base/envs/offline-3d-gis/bin/python"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["src_new"]
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

[tool.deptry]
ignore_unused = ["PyQt5", "PyQtWebEngine", "gdal", "rasterio"]
exclude = ["tests", ".venv"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src", "src_new"]

[tool.setuptools.package-data]
desktop_client = [
  "client_frontend/web_assets/**/*",
  "client_frontend/icons/*",
  "desktop_assets/web_assets/**/*",
  "desktop_assets/icons/*",
]
core_shared = [
  "db/migrations/*",
]
"src_new.clients.desktop_search" = [
  "web_assets/**/*",
  "cesium/**/*.js",
]
"src_new.clients.desktop_ingestion" = [
  "ui/**/*.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "asyncio: mark test as asyncio",
]
asyncio_mode = "auto"
